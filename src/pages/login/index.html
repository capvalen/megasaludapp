<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaSalud · Iniciar sesión</title>
  <link rel="icon" href="/src/assets/favicon.jpg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a6ae0">
  <link rel="stylesheet" href="/src/css/estilos.css">
</head>
<body class="pagina-login">

  <main class="login-tarjeta">
    <img src="/src/assets/favicon.jpg" alt="Logo MegaSalud" class="login-logo">
    <h1 class="login-titulo">MegaSalud Huancayo</h1>
    <p class="login-subtitulo">Sistema de gestión de pacientes</p>

    <form id="formLogin" class="login-form" novalidate>
      <label class="campo">
        <span class="campo-etiqueta">Usuario</span>
        <input type="text" id="usuario" placeholder="ej. juan.perez" autocomplete="username" autofocus>
        <span class="campo-sufijo" id="previewEmail"></span>
      </label>

      <label class="campo">
        <span class="campo-etiqueta">Contraseña</span>
        <div class="campo-contenedor">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
          <button type="button" class="ojo" id="btnOjo" aria-label="Mostrar u ocultar contraseña">
            <i class="ti ti-eye"></i>
          </button>
        </div>
      </label>

      <p class="login-error" id="errorLogin" hidden></p>

      <button type="submit" class="btn btn-primario btn-grande" id="btnIngresar">Ingresar</button>
    </form>

    <p class="login-pie">Acceso restringido al personal autorizado</p>
  </main>

  <script type="module" src="/src/js/login.js"></script>
</body>
</html>
