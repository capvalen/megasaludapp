<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MegaSalud · Perfil del paciente</title>
  <link rel="icon" href="/src/assets/favicon.jpg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#1a6ae0">
  <link rel="stylesheet" href="/src/css/estilos.css">
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="marca">
        <img src="/src/assets/logo.jpg" alt="Logo MegaSalud" class="logo-nav">
        <span class="marca-nombre">MegaSalud Huancayo</span>
      </div>
      <div class="navbar-derecha">
        <span class="usuario-email" id="usuarioEmail"></span>
        <button class="btn btn-ghost btn-sm" id="btnSalir"><i class="ti ti-logout"></i> Salir</button>
      </div>
    </div>
  </header>

  <main class="contenedor">

    <!-- ===== Perfil del paciente ===== -->
    <section id="vistaPerfil">
      <button class="btn btn-ghost btn-volver" id="btnVolver">← Volver a pacientes</button>
      <div class="perfil-grid">
        <aside class="tarjeta perfil-info" id="perfilInfo"></aside>
        <div>
          <div class="proc-cabecera">
            <h2>Procedimientos</h2>
            <div class="proc-cabecera-acciones">
              <button class="btn btn-ghost btn-sm" id="btnOrdenProc" title="Cambiar orden">↕ Ordenar</button>
              <button class="btn btn-primario" id="btnNuevoProc">+ Nuevo procedimiento</button>
            </div>
          </div>
          <div class="lista-proc" id="listaProcedimientos"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- ===== Modal: procedimiento (nuevo / editar) ===== -->
  <div class="modal-fondo" id="modalProc" hidden>
    <div class="modal">
      <div class="modal-cabecera">
        <h3 id="modalProcTitulo">Nuevo procedimiento</h3>
        <button type="button" class="btn-cerrar" data-cerrar="modalProc" aria-label="Cerrar">×</button>
      </div>
      <form id="formProc" class="form-proc">
        <input type="hidden" id="procId">
        <label class="campo">
          <span class="campo-etiqueta">Título *</span>
          <input type="text" id="procTitulo" required placeholder="ej. Consulta general">
        </label>
        <label class="campo">
          <span class="campo-etiqueta">Descripción</span>
          <textarea id="procDescripcion" rows="3" placeholder="Detalle del procedimiento…"></textarea>
        </label>
        <div class="fila-campos">
          <label class="campo">
            <span class="campo-etiqueta">Médico</span>
            <input type="text" id="procMedico" placeholder="ej. Dr. Juan Pérez">
          </label>
          <label class="campo">
            <span class="campo-etiqueta">Fecha de atención</span>
            <input type="date" id="procFecha">
          </label>
        </div>
        <div class="campo">
          <span class="campo-etiqueta">Adjuntar archivos</span>
          <div id="dropzoneArchivos" class="dropzone">
            <div class="dz-message">
              <svg class="dz-icono" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                <polyline points="17 8 12 3 7 8"/>
                <line x1="12" y1="3" x2="12" y2="15"/>
              </svg>np
              <p class="dz-texto">Arrastra archivos aquí o haz clic para seleccionar</p>
              <p class="dz-subtexto">PDF, JPG o JPEG · hasta 10 MB por archivo</p>
            </div>
          </div>
        </div>
        <div class="modal-acciones">
          <button type="button" class="btn btn-ghost" data-cerrar="modalProc">Cancelar</button>
          <button type="submit" class="btn btn-primario" id="btnGuardarProc">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="/src/js/perfil.js"></script>
</body>
</html>
